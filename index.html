<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AOD Pickup Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #F5F5F5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Password Overlay Screen */
        #password-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #password-screen h2 { color: blue; margin-bottom: 20px; font-size: 20px; }
        #passInput { width: 80%; max-width: 300px; padding: 15px; border: 2px solid blue; border-radius: 8px; text-align: center; font-size: 24px; letter-spacing: 10px; margin-bottom: 20px; outline: none; }
        .pass-btn { width: 80%; max-width: 300px; padding: 15px; background: blue; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; }

        /* UI Headers */
        .top-bar { background-color: blue; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: white; z-index: 1000; flex-shrink: 0; }
        .circle { background: white; color: blue; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 14px; }
        
        /* Bottom Navigation Bar */
        .category-bar { background: white; height: 65px; display: flex; border-top: 1px solid #ddd; z-index: 900; position: fixed; bottom: 0; width: 100%; }
        .icon-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; position: relative; gap: 4px; }
        .icon-item i { color: #ccc; font-size: 20px; }
        .icon-item span { font-size: 10px; color: #777; font-weight: bold; }
        .icon-item.active i, .icon-item.active span { color: blue; }
        .icon-item.active::after { content: ''; position: absolute; top: 0; width: 40%; height: 3px; background: blue; border-radius: 0 0 5px 5px; }

        /* Card Styles */
        .content-container { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .student-card { border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; min-height: 125px; }
        .pickup-card { background-color: blue; color: white; }
        .nopickup-card { background-color: #E3F2FD; color: #1565C0; border: 1px solid #BBDEFB; }
        .cancel-card { background-color: #D32F2F; color: white; }

        .student-name { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
        .student-info { font-size: 13px; opacity: 0.9; margin-bottom: 8px; }
        .day-display { font-size: 10px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 20px; display: inline-block; font-weight: bold; }

        /* Modals & Sidebar */
        .modal-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; transform: translateY(100%); transition: 0.4s ease; display: flex; flex-direction: column; }
        .modal-screen.active { transform: translateY(0); }
        .modal-header { background: blue; color: white; height: 56px; display: flex; align-items: center; padding: 0 16px; font-size: 18px; }
        .modal-content { flex: 1; padding: 20px; overflow-y: auto; }

        .sidebar { position: fixed; left: -280px; top: 0; width: 280px; height: 100%; background: white; z-index: 1500; transition: 0.3s; box-shadow: 5px 0 15px rgba(0,0,0,0.2); }
        .sidebar.active { left: 0; }
        .overlay { position: fixed; display: none; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1400; }
        .menu-item { padding: 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; cursor: pointer; }
        .menu-item i { margin-right: 15px; color: blue; width: 20px; }
        
        .btn-top { position: absolute; top: 12px; right: 12px; background: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .action-icons { margin-top: 15px; display: flex; gap: 20px; }
        .icon-btn { font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="password-screen">
        <h2>Enter the Password</h2>
        <input type="password" id="passInput" maxlength="6" placeholder="******" inputmode="numeric">
        <button class="pass-btn" onclick="verifyPassword()">SUBMIT</button>
        <button class="pass-btn" onclick="closePassScreen()" style="background:#ccc; margin-top:10px;">CANCEL</button>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu(false)"></div>

    <header class="top-bar">
        <div style="display:flex; align-items:center;">
            <div class="circle">AOD</div>
            <span style="margin-left:12px; font-size:18px;">pickup</span>
        </div>
        <i class="fas fa-ellipsis-v" onclick="showPassScreen()" style="cursor:pointer; padding: 10px;"></i>
    </header>

    <main class="content-container" id="main-content"></main>

    <nav class="category-bar">
        <div class="icon-item active" onclick="switchTab('pickup', 0)"><i class="fas fa-location-dot"></i><span>Pickup</span></div>
        <div class="icon-item" onclick="switchTab('nopickup', 1)"><i class="fas fa-location-dot"></i><span>No Pickup</span></div>
        <div class="icon-item" onclick="switchTab('cancel', 2)"><i class="fas fa-ban"></i><span>Cancel</span></div>
    </nav>

    <div class="sidebar" id="sidebar">
        <div style="background:blue; color:white; padding:24px 16px; font-weight:bold; font-size:20px;">Menu Settings</div>
        <div class="menu-item" onclick="openModal('modal-add')"><i class="fas fa-user-plus"></i> Student add detail</div>
        <div class="menu-item" onclick="openModal('modal-edit')"><i class="fas fa-user-edit"></i> Student edit and delete</div>
        <div class="menu-item" onclick="openModal('modal-automation')"><i class="fas fa-robot"></i> WhatsApp Automation</div>
        <div class="menu-item" onclick="openModal('modal-report')"><i class="fas fa-file-pdf"></i> PDF Reports</div>
    </div>

    <div id="modal-add" class="modal-screen">
        <div class="modal-header"><i class="fas fa-arrow-left" onclick="closeModal('modal-add')" style="margin-right:20px;"></i> Add New Student</div>
        <div class="modal-content">
            <input type="text" id="addName" placeholder="Name" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
            <input type="time" id="addTime" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
            <input type="text" id="addLoc" placeholder="Location" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
            <input type="tel" id="addPhone" placeholder="Phone" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
            <button onclick="saveStudent()" style="width:100%; padding:15px; background:blue; color:white; border:none; border-radius:8px;">SAVE</button>
        </div>
    </div>

    <div id="modal-edit" class="modal-screen"><div class="modal-header"><i class="fas fa-arrow-left" onclick="closeModal('modal-edit')"></i> Edit</div><div class="modal-content"><select id="editSelect" onchange="loadStudentData()" style="width:100%; padding:12px;"><option>-- Choose --</option></select><div id="editFields" style="display:none; margin-top:15px;"><input type="text" id="editName" style="width:100%; padding:12px; margin-bottom:10px;"><button onclick="updateStudent()" style="width:100%; padding:15px; background:green; color:white;">UPDATE</button><button onclick="deleteStudent()" style="width:100%; padding:12px; color:red; margin-top:10px;">DELETE</button></div></div></div>
    <div id="modal-automation" class="modal-screen"><div class="modal-header"><i class="fas fa-arrow-left" onclick="closeModal('modal-automation')"></i> Automation</div><div class="modal-content"><textarea id="autoMsg" style="width:100%; height:120px;"></textarea><button onclick="saveAutomation()" style="width:100%; padding:15px; background:blue; color:white;">SAVE</button></div></div>
    <div id="modal-report" class="modal-screen"><div class="modal-header"><i class="fas fa-arrow-left" onclick="closeModal('modal-report')"></i> Live Report</div><div class="modal-content" id="reportContent"></div></div>

    <script>
        // Password Protection Logic
        function showPassScreen() {
            document.getElementById('password-screen').style.display = 'flex';
            document.getElementById('passInput').value = '';
            document.getElementById('passInput').focus();
        }

        function closePassScreen() {
            document.getElementById('password-screen').style.display = 'none';
        }

        function verifyPassword() {
            const pass = document.getElementById('passInput').value;
            if (pass === "992302") {
                closePassScreen();
                toggleMenu(true);
            } else {
                alert("Wrong Password!");
                document.getElementById('passInput').value = '';
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDIMsFJKqHn-smyGErc9XyZPrM9ZL6UMTg",
            authDomain: "aod-e4fe4.firebaseapp.com",
            projectId: "aod-e4fe4",
            storageBucket: "aod-e4fe4.firebasestorage.app",
            messagingSenderId: "323570808577",
            appId: "1:323570808577:web:5d5002a20e0dfc651a4d00",
            measurementId: "G-XP4BWDN3PL"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let students = [];
        let currentTab = 'pickup';
        let waAutoMsg = localStorage.getItem('waMsg') || "Hello, I am outside for pickup!";
        const todayStr = new Intl.DateTimeFormat('en-US', { weekday: 'short' }).format(new Date());

        function toggleMenu(show) { document.getElementById('sidebar').classList.toggle('active', show); document.getElementById('overlay').style.display = show ? 'block' : 'none'; }
        function openModal(id) { 
            if(id === 'modal-edit') populateEditSelect(); 
            if(id === 'modal-automation') document.getElementById('autoMsg').value = waAutoMsg;
            if(id === 'modal-report') generateReport();
            document.getElementById(id).classList.add('active'); 
            toggleMenu(false); 
        }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function switchTab(tab, index) { 
            currentTab = tab; 
            document.querySelectorAll('.icon-item').forEach((el, i) => el.classList.toggle('active', i === index)); 
            renderList(); 
        }

        db.collection("students").onSnapshot((snapshot) => {
            students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderList();
        });

        async function saveStudent() {
            const name = document.getElementById('addName').value;
            if(!name) return alert("Enter Name");
            await db.collection("students").add({
                name, time: document.getElementById('addTime').value,
                days: [todayStr], loc: document.getElementById('addLoc').value,
                phone: document.getElementById('addPhone').value, isCancelled: false
            });
            closeModal('modal-add');
        }

        function renderList() {
            const container = document.getElementById('main-content');
            container.innerHTML = "";
            students.forEach(s => {
                const isToday = s.days.includes(todayStr);
                let show = false, cardClass = "";
                if(currentTab === 'pickup' && isToday && !s.isCancelled) { show = true; cardClass = "pickup-card"; }
                if(currentTab === 'nopickup' && !isToday && !s.isCancelled) { show = true; cardClass = "nopickup-card"; }
                if(currentTab === 'cancel' && s.isCancelled) { show = true; cardClass = "cancel-card"; }

                if(show) {
                    const card = document.createElement('div');
                    card.className = `student-card ${cardClass}`;
                    card.innerHTML = `
                        <div class="student-name">${s.name}</div>
                        <div class="student-info"><i class="far fa-clock"></i> ${s.time} | ${s.loc}</div>
                        ${currentTab === 'pickup' ? `
                            <button class="btn-top" style="color:red;" onclick="updateStatus('${s.id}', true)">CANCEL</button>
                            <div class="action-icons">
                                <i class="fas fa-phone-alt icon-btn" onclick="window.location.href='tel:${s.phone}'"></i>
                                <i class="fab fa-whatsapp icon-btn" onclick="window.open('https://wa.me/${s.phone}?text='+encodeURIComponent(waAutoMsg))"></i>
                                <i class="fas fa-map-marker-alt icon-btn" onclick="window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('${s.loc}'))"></i>
                            </div>
                        ` : ''}
                        ${currentTab === 'cancel' ? `<button class="btn-top" style="color:green;" onclick="updateStatus('${s.id}', false)">RESET</button>` : ''}
                    `;
                    container.appendChild(card);
                }
            });
        }

        async function updateStatus(id, status) { await db.collection("students").doc(id).update({ isCancelled: status }); }
        function populateEditSelect() { document.getElementById('editSelect').innerHTML = '<option>-- Choose --</option>' + students.map(s => `<option value="${s.id}">${s.name}</option>`).join(''); }
        function loadStudentData() { const s = students.find(x => x.id == document.getElementById('editSelect').value); if(s) { document.getElementById('editFields').style.display = 'block'; document.getElementById('editName').value = s.name; } }
        async function updateStudent() { await db.collection("students").doc(document.getElementById('editSelect').value).update({ name: document.getElementById('editName').value }); closeModal('modal-edit'); }
        async function deleteStudent() { if(confirm("Delete?")) { await db.collection("students").doc(document.getElementById('editSelect').value).delete(); closeModal('modal-edit'); } }
        function saveAutomation() { waAutoMsg = document.getElementById('autoMsg').value; localStorage.setItem('waMsg', waAutoMsg); alert("Saved!"); closeModal('modal-automation'); }
        function generateReport() { document.getElementById('reportContent').innerHTML = `<h3>Today Summary</h3><p>Success: ${students.filter(s => s.days.includes(todayStr) && !s.isCancelled).length}</p>`; }
    </script>
</body>
</html>
